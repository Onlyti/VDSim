# mu_sweep — the smallest useful campaign: one scenario, one friction axis.
#
# Run it with:
#     vdsim-campaign run configs/campaigns/mu_sweep.yaml --jobs 4 --render overview
#
# Products land in ./campaigns/mu_sweep/ — one directory per run holding
# run.vdtrace, plus index.jsonl listing the axis values and each run's
# disposition. See docs/design/BATCH_RUNNER.md.
name: mu_sweep

# Scenario every run starts from: configs/experiments/<name>.yaml.
base: step_steer

# Root seed. Per-run seeds derive from it, so the campaign is reproducible
# without recording wall-clock or pid anywhere.
seed: 20260922

# Optional override of the scenario's own duration [s].
duration: 4.0

sweep:
  # Orthogonal product of the listed axes. Keys are dotted paths into the
  # scenario document; `mu`, `vehicle.*` and `tire.*` are applied after the
  # preset is resolved.
  grid:
    mu: [0.9, 0.7, 0.5]

# Note: `level` is not a sweepable axis. L3 and L4 differ only once suspension
# hardpoints are attached and the scenario path attaches none, so the runner
# refuses the axis rather than archive traces whose manifest model_level is
# false. Declare one level per campaign; Q20 lifts the refusal
# (18_dev_briefing_0903 §30.4, §31 C-1).
