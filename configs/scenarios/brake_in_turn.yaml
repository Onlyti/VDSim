# Cornering + brake: tests combined-slip behavior.

name:          brake_in_turn
initial_vx:    15.0
duration:      5.0
dt:            0.005
mu:            1.0
interpolation: zoh

controls:
  - { t: 0.0,  throttle: 0.0, brake: 0.0, steer: 0.05 }
  - { t: 2.0,  throttle: 0.0, brake: 0.0, steer: 0.05 }
  - { t: 2.1,  throttle: 0.0, brake: 0.6, steer: 0.05 }
  - { t: 5.0,  throttle: 0.0, brake: 0.6, steer: 0.05 }
