# Approximate ISO 3888-style double-lane-change steer profile.
# Sinusoidal-ish steer captured by piecewise points; linear interp.

name:          double_lane_change
initial_vx:    15.0
duration:      6.0
dt:            0.005
mu:            1.0
interpolation: linear

controls:
  - { t: 0.0, throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 0.5, throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 1.0, throttle: 0.0, brake: 0.0, steer:  0.06 }
  - { t: 1.5, throttle: 0.0, brake: 0.0, steer:  0.06 }
  - { t: 2.0, throttle: 0.0, brake: 0.0, steer: -0.06 }
  - { t: 3.0, throttle: 0.0, brake: 0.0, steer: -0.06 }
  - { t: 3.5, throttle: 0.0, brake: 0.0, steer:  0.06 }
  - { t: 4.0, throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 6.0, throttle: 0.0, brake: 0.0, steer:  0.00 }
