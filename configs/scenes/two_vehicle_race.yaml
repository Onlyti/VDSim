id: scene.two_vehicle_race
version: 1
label: Two-car straight launch
rate: 200
cmd_timeout: 0.1
mu: 1.0
fleet:
- id: 0
  blueprint: vehicle.sedan_comfort
  level: L2
  x0: -15
  y0: -1.5
  yaw0: 0
  vx0: 12
  # Worked example of the scene sensor declaration (CONFIG_GUIDE §2.3). mount is
  # the body-frame pose (pos [m] x fwd / y left / z up, rpy [rad]); it is parsed
  # into WorldScenario and stored for future render coupling — it does not affect
  # the simulation today. No noise_std here on purpose: this scene stays
  # bit-identical to ground truth so the comms/GUI tests that read vehicle 0 keep
  # their exact expectations. Add noise_std/bias/bias_rw per entry to degrade it.
  # A mount-only block like this one declares mounts and nothing else: it does not
  # override a scenario-level `sensors:` file (CONFIG_GUIDE §2.3.1).
  sensors:
  - { id: gnss_roof, type: gnss,        mount: { pos: [0.20, 0.0, 1.42], rpy: [0, 0, 0] },     rate: 10 }
  - { id: imu_cg,    type: imu,         mount: { pos: [1.35, 0.0, 0.45], rpy: [0, 0, 0] },     rate: 200 }
  - { id: enc,       type: wheel_speed, mount: { pos: [0.0, 0.0, 0.32], rpy: [0, 0, 0] },      rate: 100 }
  - { id: cam_front, type: camera,      mount: { pos: [1.60, 0.0, 1.20], rpy: [0, -0.05, 0] }, rate: 30,
      params: { fov_deg: 90 } }
- id: 1
  blueprint: vehicle.sports_aggressive
  level: L2
  x0: -15
  y0: 1.5
  yaw0: 0
  vx0: 12
  parts:
    tire: tire.sport_grip
