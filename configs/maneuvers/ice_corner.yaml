# Cornering through an icy patch.

name:          ice_corner
initial_vx:    12.0
duration:      6.0
dt:            0.005
mu:            1.0
interpolation: zoh

controls:
  - { t: 0.0, throttle: 0.0, brake: 0.0, steer: 0.06 }
  - { t: 6.0, throttle: 0.0, brake: 0.0, steer: 0.06 }

mu_profile:
  - { t: 0.0, mu: 1.0 }
  - { t: 2.0, mu: 1.0 }
  - { t: 2.1, mu: 0.2 }
  - { t: 4.0, mu: 0.2 }
  - { t: 4.1, mu: 1.0 }
  - { t: 6.0, mu: 1.0 }
