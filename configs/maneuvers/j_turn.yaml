# J-turn: drive straight, then sudden large steer + brake.

name:          j_turn
initial_vx:    15.0
duration:      6.0
dt:            0.005
mu:            1.0
interpolation: zoh

controls:
  - { t: 0.0,  throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 1.5,  throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 1.6,  throttle: 0.0, brake: 0.4, steer:  0.15 }
  - { t: 4.0,  throttle: 0.0, brake: 0.4, steer:  0.15 }
  - { t: 4.1,  throttle: 0.0, brake: 0.0, steer:  0.00 }
  - { t: 6.0,  throttle: 0.0, brake: 0.0, steer:  0.00 }
