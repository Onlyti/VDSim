# FSK SAE Formula spec — small open-wheel race car (typical Korea formula).
# Indicative values; tune from team telemetry before competition use.

# ---- Mass ----
mass:         280.0
mass_sprung:  240.0
inertia_diag: [60.0, 110.0, 145.0]

# ---- Geometry ----
wheelbase:            1.55
cg_to_front:          0.75
cg_to_rear:           0.80
track_front:          1.20
track_rear:           1.15
cg_height:            0.30
wheel_radius_nominal: 0.26

# ---- Suspension ----
spring_stiffness:   [60000, 60000, 70000, 70000]
damper_coefficient: [3500,  3500,  4000,  4000]
unsprung_mass:      [10,    10,    10,    10]
arb_stiffness_front: 0.0        # [N m/rad] (roll stiffness derived from springs x track)
arb_stiffness_rear:  0.0        # [N m/rad]
roll_center_height_front: 0.0   # [m]
roll_center_height_rear:  0.0   # [m]
anti_dive_front:      0.30
anti_squat_rear:      0.20
camber_per_roll:      0.0

# ---- Drivetrain ----
drive_type:       RWD
differential:     Locked      # spool common on small formula
lsd_preload:      0.0
lsd_ramp:         0.0
max_motor_torque: 150.0       # ~600 cc 4-stroke peak
max_brake_torque: 1200.0
brake_bias_front: 0.58

# ---- Steering ----
steering_ratio:        4.0
max_steer_angle_wheel: 0.50
ackerman_percent:      100.0

# ---- Aero ----
aero_drag_coeff: 0.85         # open wheel with wings
frontal_area:    1.40
aero_lift_front: 1.20         # significant front wing downforce
aero_lift_rear:  1.80         # large rear wing
