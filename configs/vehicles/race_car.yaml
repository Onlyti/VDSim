# Generic LMP / GT3 class race car. Very high downforce, AWD optional.

# ---- Mass ----
mass:         900.0
mass_sprung:  820.0
inertia_diag: [350.0, 1100.0, 1300.0]

# ---- Geometry ----
wheelbase:            2.65
cg_to_front:          1.18
cg_to_rear:           1.47
track_front:          1.65
track_rear:           1.60
cg_height:            0.33
wheel_radius_nominal: 0.34

# ---- Suspension ----
spring_stiffness:   [120000, 120000, 110000, 110000]
damper_coefficient: [9000,   9000,   8500,   8500]
unsprung_mass:      [25,     25,     25,     25]
arb_stiffness_front: 0.0        # [N m/rad] (roll stiffness derived from springs x track)
arb_stiffness_rear:  0.0        # [N m/rad]
roll_center_height_front: 0.0   # [m]
roll_center_height_rear:  0.0   # [m]
anti_dive_front:      0.45
anti_squat_rear:      0.30
camber_per_roll:      0.0

# ---- Drivetrain ----
drive_type:       AWD
differential:     LSD
lsd_preload:      0.25
lsd_ramp:         0.60
max_motor_torque: 700.0
final_drive_ratio: 4.5
max_brake_torque: 5000.0
brake_bias_front: 0.62

# ---- Steering ----
steering_ratio:        10.0
max_steer_angle_wheel: 0.45
ackerman_percent:      90.0

# ---- Aero ----
aero_drag_coeff: 0.50
frontal_area:    1.90
aero_lift_front: 1.80
aero_lift_rear:  2.50
