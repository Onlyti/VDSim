# Mid-sedan reference vehicle (matches VehicleParams defaults).
#
# All units SI.  Per-wheel arrays are ordered [FL, FR, RL, RR].
#
# Use:
#   const auto vp = vdsim::VehicleParams::from_yaml("configs/vehicles/sedan.yaml");

# ---- Mass ----
mass:         1500.0       # [kg]   total vehicle mass
mass_sprung:  1350.0       # [kg]   sprung body mass
inertia_diag: [500.0, 2000.0, 2500.0]   # [kg m^2]  Ixx, Iyy, Izz (sprung)

# ---- Geometry ----
wheelbase:            2.70   # L [m]
cg_to_front:          1.20   # a [m]
cg_to_rear:           1.50   # b [m]   (a + b should equal L)
track_front:          1.55   # [m]
track_rear:           1.55   # [m]
cg_height:            0.55   # h_cg [m]
wheel_radius_nominal: 0.32   # [m]

# ---- L3 suspension ----
spring_stiffness:   [30000, 30000, 30000, 30000]   # [N/m]
damper_coefficient: [3000,  3000,  3000,  3000]    # [N s/m]
unsprung_mass:      [40,    40,    40,    40]      # [kg]
# Roll stiffness is derived from spring_stiffness x track; these are ARB-only
# additions. Roll-center height sets the geometric/elastic load-transfer split.
arb_stiffness_front: 0.0        # [N m/rad]
arb_stiffness_rear:  0.0        # [N m/rad]
roll_center_height_front: 0.0   # [m]
roll_center_height_rear:  0.0   # [m]

# ---- Drivetrain ----
drive_type:       RWD       # FWD / RWD / AWD
differential:     Open      # Open / Locked / LSD
lsd_preload:      0.10
lsd_ramp:         0.20
max_motor_torque:  300.0    # [Nm]  peak motor torque (pre-gear)
final_drive_ratio: 5.0      # [-]   motor->wheel mult (peak ~3 m/s^2)
max_brake_torque: 2000.0    # [Nm]
brake_bias_front: 0.62      # mid-sedan front-heavy bias

# ---- Steering ----
steering_ratio:        15.0   # wheel / driver
max_steer_angle_wheel: 0.50   # [rad]
ackerman_percent:      60.0   # typical sedan partial Ackerman

# ---- Aero ----
aero_drag_coeff: 0.30
frontal_area:    2.20   # [m^2]
aero_lift_front: 0.05   # mild lift (positive = downforce)
aero_lift_rear:  0.05
