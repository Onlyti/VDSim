# Generic mid-size sedan -- the values core/src/params.cpp compiles in as the
# VehicleParams() defaults, written out so a run can name the car it used
# instead of leaving `vehicle` unset.
#
# Source: vdsim.VehicleParams().to_yaml() (core/src/params.cpp
# VehicleParams::to_yaml), 2026-09-22.  This is a solver default set, not a
# measured vehicle: do not cite any number here as a specification of any real
# car.  tests/rl/test_rl_env.py (Q23-f1) compares every bound field of the
# loaded params against vdsim.VehicleParams() and fails if the two drift apart.
mass: 1500.0
mass_sprung: 1350.0
inertia_diag: [500.0, 2000.0, 2500.0]
wheelbase: 2.7
cg_to_front: 1.2
cg_to_rear: 1.5
track_front: 1.55
track_rear: 1.55
cg_height: 0.55
wheel_radius_nominal: 0.32

spring_stiffness: [30000.0, 30000.0, 30000.0, 30000.0]
damper_coefficient: [3000.0, 3000.0, 3000.0, 3000.0]
unsprung_mass: [40.0, 40.0, 40.0, 40.0]
wheel_inertia: [0.0, 0.0, 0.0, 0.0]   # 0 = core derives a disc from radius/mass
arb_stiffness_front: 0.0
arb_stiffness_rear: 0.0
roll_center_height_front: 0.0
roll_center_height_rear: 0.0
anti_dive_front: 0.0
anti_squat_rear: 0.0
camber_per_roll: 0.0

drive_type: RWD
drive_split_front: 0.5
differential: Open
lsd_preload: 0.1
lsd_ramp: 0.2
plant_path: false

max_motor_torque: 300.0
final_drive_ratio: 5.0
engine_rotational_inertia: 0.25
max_brake_torque: 2000.0
brake_bias_front: 0.5
brake_ebd_enabled: false
brake_deadtime_s: 0.0
drive_deadtime_s: 0.0
steer_deadtime_s: 0.0

steering_ratio: 15.0
max_steer_angle_wheel: 0.5
ackerman_percent: 0.0

aero_drag_coeff: 0.3
frontal_area: 2.2
aero_lift_front: 0.0
aero_lift_rear: 0.0

tire_yaml: parts/tire/generic_pacejka.yaml

# Drawn-primitive sizes for the 3D replay renderer (trace schema 0.3 geometry).
# Placeholder box for a generic sedan, no source, not a specification; no
# equation reads them.
body_lwh_m: [4.6, 1.8, 1.45]
wheel_width_m: 0.225
