# Generic Pacejka MF96 + LuGre tyre -- the values core/src/params.cpp compiles
# in as the TireParams() defaults, in the flat TireParams shape.
#
# Source: vdsim.TireParams().to_yaml(), 2026-09-22.  Not measured data.
# configs/parts/tire/default_pacejka.yaml carries the same tyre in the catalog
# part schema (id/type/schema/body); vdsim_rl reads flat files only and refuses
# catalog parts by design, so the generic car needs this flat copy.
# tests/rl/test_rl_env.py (Q23-f1) fails if these drift from the C++ defaults.
B_long: 10.0
C_long: 1.65
D_long: 1.0
E_long: 0.97
B_lat: 8.0
C_lat: 1.3
D_lat: 1.0
E_lat: -1.0

mu_nominal: 1.0
Fz_nominal: 4000.0
cornering_stiffness: 80000.0
rolling_resistance: 0.0
combined_slip_enabled: true
pneumatic_trail: 0.05
trail_falloff_alpha: 0.2
camber_stiffness: 0.0
load_sensitivity: 0.0
relaxation_length_lat: 0.0
relaxation_length_long: 0.0
tire_vertical_stiffness: 220000.0
reff_breff: 0.0
reff_dreff: 0.0
reff_freff: 0.0
crown_radius: 0.0
vlow_speed_eps: 0.15
low_speed_mode: kinematic_blend

lugre:
  enabled: true
  sigma0: 90000.0
  sigma1: 0.0
  sigma2: 75.0
  m_eff: 40.0
