id: drivetrain.sedan_v2
type: drivetrain
version: 1
schema: drivetrain_v2
label: sedan RWD Open + engine/gearbox (Drivetrain v2)
tags:
- drivetrain
- powertrain
# Drivetrain v2 part: carries a `powertrain:` block (2D engine torque map + N-speed
# gearbox + shift policy). The resolver merges `body` into the vehicle config, so the
# nested `powertrain:` map lands at the vehicle root where params.cpp parse_powertrain
# reads it. Without this block a vehicle uses the legacy flat torque (drivetrain_v1).
body:
  drive_type: RWD
  differential: Open
  powertrain:
    engine:
      idle_rpm: 800
      redline_rpm: 6500
      inertia: 0.20
      rpm_breaks:      [1000, 2500, 4000, 5500, 6500]
      throttle_breaks: [0.0, 0.5, 1.0]
      torque_map:
        - [-15,  -20,  -25,  -30,  -35]
        - [ 95,  150,  165,  150,  120]
        - [180,  300,  330,  300,  250]
    gearbox:
      gear_ratios: [3.40, 2.05, 1.40, 1.00, 0.82, 0.68]
      reverse_ratio: 3.20
      final_drive: 4.10
      efficiency: 0.92
      shift_time: 0.25
    shift:
      mode: auto_rpm
      upshift_rpm: 6000
      downshift_rpm: 2000
      start_gear: 1
