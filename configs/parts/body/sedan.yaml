  # Body box and wheel width, for the 3D replay renderer (trace schema 0.3,
  # 11_trace_contract_spec 3.1.1). This preset is a generic 1500 kg sedan with
  # no real-vehicle source, so the box is derived from the preset's own
  # geometry rather than measured: length = wheelbase 2.70 m plus 0.95 m of
  # combined overhang, width = track 1.55 m plus 0.25 m of body outboard of the
  # wheel centres, height typical of a saloon with this 0.55 m CG height.
  # wheel_width_m is the section width of a 225/50R17 tyre, which matches
  # wheel_radius_nominal 0.32 m. These size drawn primitives only -- no
  # equation reads them.
  body_lwh_m: [4.60, 1.80, 1.45]
  wheel_width_m: 0.225
