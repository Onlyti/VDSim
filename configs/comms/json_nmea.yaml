# Text TX templates — works today in vdsim_realtime (the C++ comms router).
# Scenario-level: a scene references this via `comms: json_nmea`.
#   TX json:     vehicle 0 STATE as a compact one-line JSON object (HTTP/MQTT bridges).
#                Non-finite values (diverged solver) are emitted as `null`, so the
#                object always parses; it never puts "nan"/"inf" on the wire.
#   TX nmea_gga: vehicle 0 as an NMEA 0183 $GPGGA sentence ("*HH\r\n"-terminated).
#                A non-finite or absurd state degrades to a "no fix" sentence
#                (quality 0, empty position fields) instead of a malformed one.
#   RX:          canonical VDS1 CMD fan-in, same as configs/comms/vds1_loopback.yaml.
#
# `origin` is the geodetic datum the sim's ENU metres (X east, Y north, Z up) are
# referenced to; it only matters for lat/lon templates. Optional — it defaults to
# lat 0 / lon 0 / alt 0. The ENU -> lat/lon transform is the exact closed-form
# WGS84 inverse (ENU -> ECEF -> geodetic; formula + limits: cosim/comms_templates.hpp,
# enu_to_geodetic), accurate to sub-micrometre at any latitude and any offset —
# it is NOT latitude-sensitive the way an equirectangular approximation is.
# What remains is the definition of ENU itself: it is a flat tangent plane, so a
# horizontal offset d sits ~d^2/(2R) above the ellipsoid (7.8 m at 10 km, and that
# shows up in the GGA altitude) and its ground track differs from a true WGS84
# geodesic by ~d^3/(3R^2) (8 mm at 10 km, 8.2 m at 100 km). Altitudes are
# ellipsoidal, not orthometric: there is no geoid model, so geoid separation is 0.
# The GGA fix follows the *measured* GNSS channel, so configured sensor noise shows up.
#
# Exercised end-to-end by tests/scripts/test_comms_tx_templates.py, which runs
# THIS file (only the ports are remapped onto free ones).
name: json_nmea
channels:
  - source: 0.state
    template: json
    to: [ {ip: 127.0.0.1, port: 7100} ]
  - source: 0.state
    template: nmea_gga
    origin: { lat: 37.5665, lon: 126.9780, alt: 38.0 }   # Seoul City Hall
    to: [ {ip: 127.0.0.1, port: 9001} ]
  - direction: in
    template: vds1_cmd
    listen: { port: 7001 }
