# Beam (rigid) axle — truck / van / 4WD / heavy duty.
#
# Both rear wheels share a single rigid axle housing.  Vertical motion is
# decoupled from steering and is mostly heave + roll about the axle's
# longitudinal axis.

topology: beam_axle
name:     "4WD RL beam axle"

bodies:
  - { id: chassis,       mass: 0.0,  inertia_diag: [0,0,0], cg_local: [0,0,0] }
  - { id: axle_housing,  mass: 70.0, inertia_diag: [25.0, 1.5, 25.0], cg_local: [-1.5, 0.0, -0.20] }
  - { id: knuckle_left,  mass: 0.0,  inertia_diag: [0,0,0], cg_local: [0,0,0] }
  - { id: knuckle_right, mass: 0.0,  inertia_diag: [0,0,0], cg_local: [0,0,0] }

hardpoints:
  - { name: axle_left_wheel,  body_id: axle_housing, position: [ 0.00,  0.78, 0.00] }
  - { name: axle_right_wheel, body_id: axle_housing, position: [ 0.00, -0.78, 0.00] }
  - { name: panhard_chassis,  body_id: chassis,      position: [-1.50, -0.55, -0.10] }
  - { name: panhard_axle,     body_id: axle_housing, position: [ 0.00,  0.55, -0.10] }
  - { name: trailing_link_chassis, body_id: chassis, position: [-0.80, 0.45,  0.05] }
  - { name: trailing_link_axle,    body_id: axle_housing, position: [ 0.00, 0.45, 0.00] }
  - { name: leaf_spring_front, body_id: chassis,    position: [-1.10, 0.55, -0.05] }
  - { name: leaf_spring_rear,  body_id: chassis,    position: [-1.90, 0.55, -0.05] }
  - { name: leaf_spring_axle,  body_id: axle_housing, position: [ 0.00, 0.55, -0.15] }

joints:
  - { id: j_panhard,        type: ball, body_a: chassis, body_b: axle_housing,
      position_in_a: [-1.50, -0.55, -0.10], position_in_b: [ 0.00, 0.55, -0.10] }
  - { id: j_trailing_link,  type: ball, body_a: chassis, body_b: axle_housing,
      position_in_a: [-0.80,  0.45,  0.05], position_in_b: [ 0.00, 0.45,  0.00] }
  - { id: j_knuckle_left,   type: rigid, body_a: axle_housing, body_b: knuckle_left,
      position_in_a: [ 0.00,  0.78, 0.00], position_in_b: [0, 0, 0] }
  - { id: j_knuckle_right,  type: rigid, body_a: axle_housing, body_b: knuckle_right,
      position_in_a: [ 0.00, -0.78, 0.00], position_in_b: [0, 0, 0] }

bushings:
  - { id: b_leaf_front, body_a: chassis, body_b: axle_housing,
      position_in_a: [-1.10, 0.55, -0.05], position_in_b: [ 0.00, 0.55, -0.15],
      axis_in_a: [1, 0, 0],
      k_translation: [2.0e7, 1.5e6, 2.0e7], k_rotation: [800, 200, 800],
      c_translation: [4000, 800, 4000], c_rotation: [10, 5, 10] }
