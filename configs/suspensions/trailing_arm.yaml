# Trailing arm — economy / small car rear suspension.

topology: trailing_arm
name:     "compact RL trailing arm"

bodies:
  - { id: chassis,      mass: 0.0,  inertia_diag: [0,0,0], cg_local: [0,0,0] }
  - { id: trailing_arm, mass: 12.0, inertia_diag: [0.20, 0.80, 0.80], cg_local: [0.20, 0.55, -0.05] }
  - { id: knuckle,      mass: 0.0,  inertia_diag: [0,0,0], cg_local: [0,0,0] }   # rigidly attached to arm

hardpoints:
  - { name: arm_pivot,     body_id: chassis,      position: [ 0.65, 0.45, 0.05] }
  - { name: arm_to_knuckle,body_id: trailing_arm, position: [-0.40, 0.30, 0.00] }
  - { name: damper_top,    body_id: chassis,      position: [ 0.10, 0.50, 0.50] }
  - { name: damper_bottom, body_id: trailing_arm, position: [-0.20, 0.20, 0.10] }
  - { name: wheel_center,  body_id: knuckle,      position: [ 0.00, 0.78, 0.00] }

joints:
  - { id: j_arm_pivot,   type: revolute, body_a: chassis, body_b: trailing_arm,
      position_in_a: [ 0.65, 0.45, 0.05], position_in_b: [ 0.45, 0.00, 0.00],
      axis_in_a: [0, 1, 0] }
  - { id: j_arm_knuckle, type: rigid,    body_a: trailing_arm, body_b: knuckle,
      position_in_a: [-0.40, 0.30, 0.00], position_in_b: [0, 0, 0] }

bushings:
  - { id: b_arm_pivot, body_a: chassis, body_b: trailing_arm,
      position_in_a: [ 0.65, 0.45, 0.05], position_in_b: [ 0.45, 0.00, 0.00],
      axis_in_a: [0, 1, 0],
      k_translation: [3.0e6, 3.0e5, 3.0e5], k_rotation: [150, 150, 150],
      c_translation: [2000, 800, 800], c_rotation: [3, 3, 3] }
