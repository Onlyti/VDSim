# Twist beam — most economical rear suspension for FWD compacts.
#
# A U-shaped beam couples the two trailing arms via torsional compliance.
# We model this as two trailing arms with a single torsional bushing.

topology: twist_beam
name:     "FWD compact RL twist beam"

bodies:
  - { id: chassis,        mass: 0.0,   inertia_diag: [0,0,0],          cg_local: [0,0,0] }
  - { id: trail_left,     mass: 8.0,   inertia_diag: [0.15, 0.40, 0.40], cg_local: [0.10, 0.50, -0.05] }
  - { id: trail_right,    mass: 8.0,   inertia_diag: [0.15, 0.40, 0.40], cg_local: [0.10, -0.50, -0.05] }
  - { id: knuckle_left,   mass: 0.0,   inertia_diag: [0,0,0],          cg_local: [0,0,0] }
  - { id: knuckle_right,  mass: 0.0,   inertia_diag: [0,0,0],          cg_local: [0,0,0] }

hardpoints:
  - { name: left_pivot,         body_id: chassis,     position: [ 0.55, 0.45, 0.05] }
  - { name: right_pivot,        body_id: chassis,     position: [ 0.55, -0.45, 0.05] }
  - { name: left_axle,          body_id: trail_left,  position: [-0.40, 0.30, 0.00] }
  - { name: right_axle,         body_id: trail_right, position: [-0.40, -0.30, 0.00] }
  - { name: cross_beam_left,    body_id: trail_left,  position: [-0.15, 0.20, -0.05] }
  - { name: cross_beam_right,   body_id: trail_right, position: [-0.15, -0.20, -0.05] }
  - { name: damper_left_top,    body_id: chassis,     position: [ 0.00, 0.55, 0.45] }
  - { name: damper_left_bottom, body_id: trail_left,  position: [-0.20, 0.20, 0.10] }

joints:
  - { id: j_left_pivot,  type: revolute, body_a: chassis, body_b: trail_left,
      position_in_a: [ 0.55, 0.45, 0.05], position_in_b: [ 0.45, 0.00, 0.00], axis_in_a: [0, 1, 0] }
  - { id: j_right_pivot, type: revolute, body_a: chassis, body_b: trail_right,
      position_in_a: [ 0.55, -0.45, 0.05], position_in_b: [ 0.45, 0.00, 0.00], axis_in_a: [0, 1, 0] }
  - { id: j_left_knk,    type: rigid,    body_a: trail_left,  body_b: knuckle_left,
      position_in_a: [-0.40, 0.30, 0.00], position_in_b: [0, 0, 0] }
  - { id: j_right_knk,   type: rigid,    body_a: trail_right, body_b: knuckle_right,
      position_in_a: [-0.40, -0.30, 0.00], position_in_b: [0, 0, 0] }

# Twist beam compliance: dominant DOF is torsion (about beam-x).
bushings:
  - { id: b_twist_beam, body_a: trail_left, body_b: trail_right,
      position_in_a: [-0.15,  0.20, -0.05], position_in_b: [-0.15, -0.20, -0.05],
      axis_in_a: [1, 0, 0],
      k_translation: [5.0e7, 5.0e7, 5.0e7], k_rotation: [2000, 50, 2000],
      c_translation: [5000, 5000, 5000], c_rotation: [25, 5, 25] }
