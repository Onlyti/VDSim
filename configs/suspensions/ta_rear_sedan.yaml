# Semi-trailing arm rear suspension — sedan baseline.
#
# Frame: body frame ISO 8855 RH (+x forward, +y leftward, +z up).
# Hardpoints for LEFT wheel (RL); right is mirrored.
#
# A trailing arm rotates as a single rigid body about a single chassis-side
# revolute axis.  The wheel + knuckle are rigidly attached to the arm.
#
# Pure trailing: axis along +y (perpendicular to x), zero toe gain.
# Semi-trailing: axis at angle theta from the pure-trailing direction; gives
# camber + toe gain with wheel travel ("semi-trailing camber/toe gain").
#
# Steering is absent on rear (no tie rod).  The `steer_input` for
# ISuspensionKinematics is unused; we still emit it in the CSV grid for
# schema uniformity (single column with 0).

type: trailing_arm
side: left

wheel:
  center:        [-1.35, 0.78, 0.305]
  spin_axis:     [0.0, 1.0, 0.0]
  static_radius: 0.305

# Single revolute axis: pivot specified by two chassis points.
# For pure trailing arm: chassis_inboard and chassis_outboard along +y.
# For semi-trailing: axis tilted in the x-y plane (toe-camber inducing).
arm_pivot:
  chassis_inboard:  [-0.80, 0.42, 0.22]
  chassis_outboard: [-0.75, 0.62, 0.20]
# Note: tilt of (outboard - inboard) from pure +y direction sets the
# semi-trailing angle.  For this sample: y-direction component dominates
# but with mild x and z deviations.
