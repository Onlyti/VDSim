# MacPherson strut — common sedan front suspension.
#
# Body frame: vehicle CG at origin, +x forward, +y leftward, +z up (ISO 8855 RH).
# Hardpoint values are illustrative for a typical mid-sedan front corner.
# All units: m.

topology: macpherson
name:     "mid-sedan FL MacPherson"

bodies:
  - { id: chassis,        mass: 0.0,  inertia_diag: [0,0,0],  cg_local: [0,0,0] }
  - { id: lower_control_arm, mass: 8.5, inertia_diag: [0.05, 0.20, 0.20], cg_local: [-0.10, 0.50, -0.05] }
  - { id: strut,          mass: 12.0, inertia_diag: [0.20, 0.20, 0.05], cg_local: [0.00, 0.70, 0.30] }
  - { id: knuckle,        mass: 6.5,  inertia_diag: [0.04, 0.04, 0.04], cg_local: [0.00, 0.75, 0.05] }
  - { id: tie_rod,        mass: 1.8,  inertia_diag: [0.01, 0.04, 0.04], cg_local: [-0.10, 0.50, 0.05] }

hardpoints:
  # body_id refers to which body's frame the coordinate is expressed in.
  - { name: lca_inner_front,  body_id: chassis, position: [ 0.20, 0.30, -0.05] }
  - { name: lca_inner_rear,   body_id: chassis, position: [-0.10, 0.30, -0.05] }
  - { name: lca_outer_ball,   body_id: knuckle, position: [ 0.00, 0.72, -0.05] }
  - { name: strut_top_mount,  body_id: chassis, position: [ 0.10, 0.40,  0.50] }
  - { name: strut_to_knuckle, body_id: knuckle, position: [ 0.00, 0.74,  0.15] }
  - { name: tie_rod_inner,    body_id: chassis, position: [-0.10, 0.30,  0.05] }
  - { name: tie_rod_outer,    body_id: knuckle, position: [-0.10, 0.72,  0.05] }
  - { name: wheel_center,     body_id: knuckle, position: [ 0.00, 0.80,  0.00] }

joints:
  - { id: j_lca_front,  type: revolute, body_a: chassis,           body_b: lower_control_arm,
      position_in_a: [ 0.20, 0.30, -0.05], position_in_b: [ 0.10, 0.00, 0.00], axis_in_a: [1, 0, 0] }
  - { id: j_lca_rear,   type: revolute, body_a: chassis,           body_b: lower_control_arm,
      position_in_a: [-0.10, 0.30, -0.05], position_in_b: [-0.20, 0.00, 0.00], axis_in_a: [1, 0, 0] }
  - { id: j_lca_outer,  type: ball,     body_a: lower_control_arm, body_b: knuckle,
      position_in_a: [ 0.00, 0.42, 0.00],  position_in_b: [ 0.00,-0.03,-0.05] }
  - { id: j_strut_top,  type: ball,     body_a: chassis,           body_b: strut,
      position_in_a: [ 0.10, 0.40, 0.50],  position_in_b: [ 0.00, 0.00, 0.20] }
  - { id: j_strut_knk,  type: prismatic, body_a: strut,            body_b: knuckle,
      position_in_a: [ 0.00, 0.00,-0.15],  position_in_b: [ 0.00, 0.04, 0.10], axis_in_a: [0, 0, 1] }
  - { id: j_tie_rod_in, type: ball,     body_a: chassis,           body_b: tie_rod,
      position_in_a: [-0.10, 0.30, 0.05],  position_in_b: [ 0.10, 0.00, 0.00] }
  - { id: j_tie_rod_out,type: ball,     body_a: tie_rod,           body_b: knuckle,
      position_in_a: [-0.10, 0.00, 0.00],  position_in_b: [-0.10,-0.03, 0.00] }

bushings: []
