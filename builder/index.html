<!doctype html>
<html><head><meta charset="utf-8"><title>VDSim Experiment Builder</title>
<style>
 :root{--bg:#0f1420;--panel:#19202e;--line:#2b3547;--fg:#d6deea;--mut:#8aa;--acc:#01A0E9;--pri:#005195;}
 *{box-sizing:border-box} body{margin:0;font:13px/1.5 Calibri,Arial,sans-serif;background:var(--bg);color:var(--fg)}
 header{background:#002060;padding:8px 16px;font-weight:bold;font-size:15px}
 .tabs{display:flex;gap:2px;background:#0c111b;padding:6px 12px 0;border-bottom:1px solid var(--line)}
 .tab{padding:8px 18px;cursor:pointer;border-radius:6px 6px 0 0;color:var(--mut);background:#141b28}
 .tab.on{background:var(--panel);color:#fff;font-weight:bold}
 main{padding:16px;display:grid;grid-template-columns:380px 1fr;gap:16px}
 .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
 h3{margin:0 0 10px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
 .fld{display:flex;align-items:center;gap:8px;margin:5px 0}
 .fld label{flex:0 0 150px;color:var(--mut)}
 .fld input,.fld select{flex:1;background:#0d121c;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:5px 7px}
 .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
 button{background:var(--pri);color:#fff;border:0;border-radius:5px;padding:7px 14px;cursor:pointer}
 button.ghost{background:#222c3d}
 button:hover{background:var(--acc)}
 .grp{margin:12px 0 4px;color:#fff;font-weight:bold;border-top:1px solid var(--line);padding-top:8px}
 .stat{margin-top:8px;color:var(--mut);font-size:12px;white-space:pre-wrap}
 canvas{background:#0b0f17;border:1px solid var(--line);border-radius:6px;width:100%;height:520px}
 table{width:100%;border-collapse:collapse;font-size:12px} td,th{border:1px solid var(--line);padding:3px 5px}
 .hide{display:none}
 .pill{display:inline-block;background:#0d121c;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mut);font-size:11px}
</style></head><body>
<header>VDSim · Experiment Builder <span class="pill">authoring tool — outputs configs/ YAML</span></header>
<div class="tabs" id="tabs"></div>
<main>
 <div class="panel" id="form"></div>
 <div class="panel" id="side"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const api={
 get:(p)=>fetch(p).then(r=>r.json()),
 post:(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json())
};
let TAB='vehicle';
const TABS=['vehicle','sensors','map','comms','scenario'];
function tabbar(){ $('#tabs').innerHTML=TABS.map(t=>`<div class="tab ${t===TAB?'on':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</div>`).join(''); }
function setTab(t){ TAB=t; tabbar(); render(); }

// ---- field helpers -------------------------------------------------------
function num(label,id,v,step){return `<div class="fld"><label>${label}</label><input id="${id}" type="number" step="${step||'any'}" value="${v}"></div>`;}
function txt(label,id,v){return `<div class="fld"><label>${label}</label><input id="${id}" type="text" value="${v||''}"></div>`;}
function sel(label,id,opts,v){return `<div class="fld"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select></div>`;}
async function options(kind){ return (await api.get('/api/list?kind='+kind)).names; }
function val(id){const e=$('#'+id);return e?(e.type==='number'?parseFloat(e.value):e.value):null;}

// ===========================================================================
// VEHICLE
// ===========================================================================
async function render(){
 if(TAB==='vehicle') return renderVehicle();
 if(TAB==='sensors') return renderSensors();
 if(TAB==='map')     return renderMap();
 if(TAB==='comms')   return renderComms();
 if(TAB==='scenario')return renderScenario();
}
const VEH_DEF={name:'my_vehicle',mass:1500,mass_sprung:1350,wheelbase:2.70,cg_to_front:1.20,cg_to_rear:1.50,
 track_front:1.55,track_rear:1.55,cg_height:0.55,wheel_radius_nominal:0.32,drive_type:'RWD',
 max_motor_torque:300,final_drive_ratio:5.0,max_brake_torque:2000,brake_bias_front:0.62,
 steering_ratio:15.0,max_steer_angle_wheel:0.5,ackerman_percent:60,aero_drag_coeff:0.30,frontal_area:2.2};
async function renderVehicle(){
 const presets=await options('vehicles');
 $('#form').innerHTML=`<h3>Vehicle builder</h3>
  <div class="fld"><label>load preset</label><select id="v_load"><option value=""></option>${presets.map(p=>`<option>${p}</option>`).join('')}</select></div>
  ${txt('name','name',VEH_DEF.name)}
  <div class="grp">Mass / geometry</div>
  ${num('mass [kg]','mass',VEH_DEF.mass)}${num('mass_sprung','mass_sprung',VEH_DEF.mass_sprung)}
  ${num('wheelbase [m]','wheelbase',VEH_DEF.wheelbase)}${num('cg_to_front','cg_to_front',VEH_DEF.cg_to_front)}${num('cg_to_rear','cg_to_rear',VEH_DEF.cg_to_rear)}
  ${num('track_front','track_front',VEH_DEF.track_front)}${num('track_rear','track_rear',VEH_DEF.track_rear)}
  ${num('cg_height','cg_height',VEH_DEF.cg_height)}${num('wheel_radius','wheel_radius_nominal',VEH_DEF.wheel_radius_nominal)}
  <div class="grp">Powertrain / brakes / steering</div>
  ${sel('drive_type','drive_type',['FWD','RWD','AWD'],VEH_DEF.drive_type)}
  ${num('max_motor_torque','max_motor_torque',VEH_DEF.max_motor_torque)}${num('final_drive_ratio','final_drive_ratio',VEH_DEF.final_drive_ratio)}
  ${num('max_brake_torque','max_brake_torque',VEH_DEF.max_brake_torque)}${num('brake_bias_front','brake_bias_front',VEH_DEF.brake_bias_front)}
  ${num('steering_ratio','steering_ratio',VEH_DEF.steering_ratio)}${num('max_steer_angle_wheel','max_steer_angle_wheel',VEH_DEF.max_steer_angle_wheel)}${num('ackerman_percent','ackerman_percent',VEH_DEF.ackerman_percent)}
  <div class="grp">Aero</div>
  ${num('aero_drag_coeff','aero_drag_coeff',VEH_DEF.aero_drag_coeff)}${num('frontal_area','frontal_area',VEH_DEF.frontal_area)}
  <div class="row"><button onclick="vehPreview()">Preview</button><button onclick="saveVehicle()">Save</button></div>
  <div class="stat" id="v_stat"></div>`;
 $('#v_load').onchange=async e=>{ if(!e.target.value)return; const d=(await api.get('/api/load?kind=vehicles&name='+e.target.value)).data;
   for(const k in VEH_DEF){ const el=$('#'+k); if(el&&d[k]!=null) el.value=d[k]; } $('#name').value=e.target.value; };
 $('#side').innerHTML=`<h3>Quick check</h3><div class="stat" id="v_prev">Press Preview to run a full-throttle launch (L2) and read peak accel / 7 s speed.</div>`;
}
function vehData(){ const d={}; for(const k in VEH_DEF){ d[k]=(k==='name'||k==='drive_type')?val(k):val(k); } d.name=$('#name').value; d.drive_type=$('#drive_type').value; return d; }
async function vehPreview(){ const r=await api.post('/api/preview/vehicle',{data:vehData()});
  $('#v_prev').textContent=r.ok?`mass ${r.mass} kg · wheelbase ${r.wheelbase} m\npeak ax ≈ ${r.peak_ax} m/s²\nvx after 7 s full throttle ≈ ${r.vx_7s} m/s`:('error: '+r.msg); }
async function saveVehicle(){ const r=await api.post('/api/save',{kind:'vehicles',name:$('#name').value,data:vehData()});
  $('#v_stat').textContent=r.ok?('saved → '+r.path):('FAILED: '+r.msg); }

// ===========================================================================
// SENSORS (suite with mount poses)
// ===========================================================================
let SENSORS=[];
async function renderSensors(){
 const presets=await options('sensors');
 $('#form').innerHTML=`<h3>Sensor suite builder</h3>
  <div class="fld"><label>load preset</label><select id="s_load"><option value=""></option>${presets.map(p=>`<option>${p}</option>`).join('')}</select></div>
  ${txt('name','s_name','my_sensors')}
  <div class="grp">Add sensor</div>
  ${sel('type','s_type',['gnss','imu','wheel_speed','steer','camera','lidar'],'gnss')}
  ${txt('id','s_id','gnss')}
  ${num('mount x','s_mx',0)}${num('mount y','s_my',0)}${num('mount z','s_mz',1.0)}
  ${num('yaw [deg]','s_yaw',0)}${num('rate [Hz]','s_rate',20)}${num('noise std','s_noise',0.3)}
  <div class="row"><button onclick="addSensor()">+ Add</button><button onclick="saveSensors()">Save suite</button></div>
  <div class="stat" id="s_stat"></div>`;
 $('#s_load').onchange=async e=>{ if(!e.target.value)return; const d=(await api.get('/api/load?kind=sensors&name='+e.target.value)).data;
   SENSORS=(d&&d.sensors)||[]; $('#s_name').value=e.target.value; drawSensors(); };
 drawSensors();
}
function addSensor(){ SENSORS.push({id:$('#s_id').value,type:$('#s_type').value,
   mount:[val('s_mx'),val('s_my'),val('s_mz')],yaw:val('s_yaw'),rate:val('s_rate'),noise_std:val('s_noise')}); drawSensors(); }
function rmSensor(i){ SENSORS.splice(i,1); drawSensors(); }
function drawSensors(){ $('#side').innerHTML=`<h3>Suite (${SENSORS.length})</h3>
  <table><tr><th>id</th><th>type</th><th>mount</th><th>yaw</th><th>rate</th><th>noise</th><th></th></tr>
  ${SENSORS.map((s,i)=>`<tr><td>${s.id}</td><td>${s.type}</td><td>[${s.mount.join(', ')}]</td><td>${s.yaw}</td><td>${s.rate}</td><td>${s.noise_std}</td><td><button class="ghost" onclick="rmSensor(${i})">×</button></td></tr>`).join('')}</table>`; }
async function saveSensors(){ const r=await api.post('/api/save',{kind:'sensors',name:$('#s_name').value,data:{name:$('#s_name').value,sensors:SENSORS}});
  $('#s_stat').textContent=r.ok?('saved → '+r.path):('FAILED: '+r.msg); }

// ===========================================================================
// MAP (driving line + width + surface)
// ===========================================================================
let MAPPTS=[];
async function renderMap(){
 const presets=await options('maps'); const roads=await options('roads');
 $('#form').innerHTML=`<h3>Map builder</h3>
  <div class="fld"><label>load preset</label><select id="m_load"><option value=""></option>${presets.map(p=>`<option>${p}</option>`).join('')}</select></div>
  ${txt('name','m_name','my_track')}
  <div class="grp">Driving line</div>
  ${sel('source','m_src',['shape','xodr','rd5','waypoints'],'shape')}
  <div id="m_shape">
   ${sel('shape','m_shape_k',['oval','circle','figure8'],'oval')}
   ${num('R [m]','m_R',50)}${num('L (oval) [m]','m_L',150)}${num('points','m_n',160)}
  </div>
  <div id="m_import" class="hide">${txt('file path','m_path','')}</div>
  <div class="grp">Road</div>
  ${num('width [m]','m_w',12)}
  ${sel('surface','m_surf',['(none)'].concat(roads),'(none)')}
  <div class="row"><button onclick="mapPreview()">Preview</button><button onclick="saveMap()">Save</button></div>
  <div class="stat" id="m_stat"></div>`;
 $('#m_src').onchange=e=>{ const sh=e.target.value==='shape'; $('#m_shape').classList.toggle('hide',!sh); $('#m_import').classList.toggle('hide',sh||e.target.value==='waypoints'); };
 $('#m_load').onchange=async e=>{ if(!e.target.value)return; const d=(await api.get('/api/load?kind=maps&name='+e.target.value)).data; $('#m_name').value=e.target.value;
   if(d.driving_line){ $('#m_src').value=d.driving_line.source||'shape'; if(d.driving_line.shape)$('#m_shape_k').value=d.driving_line.shape;
     if(d.driving_line.R)$('#m_R').value=d.driving_line.R; if(d.driving_line.L)$('#m_L').value=d.driving_line.L; if(d.driving_line.path)$('#m_path').value=d.driving_line.path; }
   if(d.road){ $('#m_w').value=d.road.width||12; if(d.road.surface&&d.road.surface.ref)$('#m_surf').value=d.road.surface.ref; }
   $('#m_src').onchange(); mapPreview(); };
 $('#side').innerHTML=`<h3>Map preview</h3><canvas id="m_cv"></canvas><div class="stat" id="m_info"></div>`;
}
function mapData(){ const src=val('m_src'); const dl={source:src};
  if(src==='shape'){ dl.shape=val('m_shape_k'); dl.R=val('m_R'); dl.L=val('m_L'); dl.n=val('m_n'); }
  else if(src==='waypoints'){ dl.points=MAPPTS; }
  else { dl.path=$('#m_path').value; }
  const d={name:$('#m_name').value,driving_line:dl,road:{width:val('m_w')}};
  if(val('m_surf')!=='(none)') d.road.surface={ref:val('m_surf')};
  return d; }
async function mapPreview(){ const r=await api.post('/api/preview/map',{data:mapData()});
  if(!r.ok){ $('#m_info').textContent='error: '+r.msg; return; }
  MAPPTS=r.pts; drawMap(r.pts); }
function drawMap(pts){ const cv=$('#m_cv'); const W=cv.clientWidth,Hh=cv.clientHeight; cv.width=W;cv.height=Hh;
  const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,Hh); if(!pts.length){return;}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]); const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const pad=30,sx=(W-2*pad)/((maxx-minx)||1),sy=(Hh-2*pad)/((maxy-miny)||1),s=Math.min(sx,sy);
  const tx=x=>pad+(x-minx)*s, ty=y=>Hh-pad-(y-miny)*s;
  const w=val('m_w')||12; ctx.strokeStyle='#3a3a42'; ctx.lineWidth=Math.max(2,w*s);
  ctx.beginPath(); pts.forEach((p,i)=>{ i?ctx.lineTo(tx(p[0]),ty(p[1])):ctx.moveTo(tx(p[0]),ty(p[1])); }); ctx.stroke();
  ctx.strokeStyle='#01A0E9'; ctx.lineWidth=1.5; ctx.beginPath(); pts.forEach((p,i)=>{ i?ctx.lineTo(tx(p[0]),ty(p[1])):ctx.moveTo(tx(p[0]),ty(p[1])); }); ctx.stroke();
  ctx.fillStyle='#3f6'; ctx.beginPath(); ctx.arc(tx(pts[0][0]),ty(pts[0][1]),5,0,7); ctx.fill();
  let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  $('#m_info').textContent=`${pts.length} pts · length ${len.toFixed(0)} m · width ${w} m · bbox ${(maxx-minx).toFixed(0)}×${(maxy-miny).toFixed(0)} m`; }
async function saveMap(){ const r=await api.post('/api/save',{kind:'maps',name:$('#m_name').value,data:mapData()});
  $('#m_stat').textContent=r.ok?('saved → '+r.path):('FAILED: '+r.msg); }

// ===========================================================================
// COMMS (data routing)
// ===========================================================================
let CHANNELS=[];
const TEMPLATES=['json','vds1_state','vds1_cmd','nmea_gga','imu_raw'];
async function renderComms(){
 const presets=await options('comms'), sens=await options('sensors');
 $('#form').innerHTML=`<h3>Comms builder</h3>
  <div class="fld"><label>load preset</label><select id="c_load"><option value=""></option>${presets.map(p=>`<option>${p}</option>`).join('')}</select></div>
  ${txt('name','c_name','my_comms')}
  <div class="grp">Add channel</div>
  ${sel('direction','c_dir',['out','in'],'out')}
  ${sel('source','c_src',['ego.state','ego.cmd','ego.sensor.gnss','ego.sensor.imu0'],'ego.state')}
  ${sel('template','c_tmpl',TEMPLATES,'json')}
  <div id="c_out">${txt('to ip','c_ip','127.0.0.1')}${num('to port','c_port',7100)}</div>
  <div id="c_in" class="hide">${num('listen port','c_lport',7001)}</div>
  <div class="row"><button onclick="addChannel()">+ Add</button><button onclick="saveComms()">Save</button></div>
  <div class="stat" id="c_stat"></div>`;
 $('#c_dir').onchange=e=>{ const out=e.target.value==='out'; $('#c_out').classList.toggle('hide',!out); $('#c_in').classList.toggle('hide',out); };
 $('#c_load').onchange=async e=>{ if(!e.target.value)return; const d=(await api.get('/api/load?kind=comms&name='+e.target.value)).data; CHANNELS=(d&&d.channels)||[]; $('#c_name').value=e.target.value; drawComms(); };
 drawComms();
}
function addChannel(){
 if(val('c_dir')==='in') CHANNELS.push({direction:'in',template:val('c_tmpl'),listen:{port:val('c_lport')}});
 else CHANNELS.push({source:val('c_src'),template:val('c_tmpl'),to:[{ip:$('#c_ip').value,port:val('c_port')}]});
 drawComms();
}
function rmChannel(i){ CHANNELS.splice(i,1); drawComms(); }
function addDest(i){ const ip=prompt('dest ip','127.0.0.1'); const p=prompt('dest port','7101'); if(ip&&p){ CHANNELS[i].to.push({ip,port:+p}); drawComms(); } }
function drawComms(){ $('#side').innerHTML=`<h3>Channels (${CHANNELS.length})</h3>
  <table><tr><th>dir</th><th>source</th><th>template</th><th>to / listen</th><th></th></tr>
  ${CHANNELS.map((c,i)=>`<tr><td>${c.direction||'out'}</td><td>${c.source||'-'}</td><td>${c.template}</td>
    <td>${c.direction==='in'?(':'+c.listen.port):c.to.map(d=>d.ip+':'+d.port).join(', ')+` <button class="ghost" onclick="addDest(${i})">+ip</button>`}</td>
    <td><button class="ghost" onclick="rmChannel(${i})">×</button></td></tr>`).join('')}</table>
  <div class="stat" style="margin-top:8px">out = source → destinations (fan-out). in = listen for control (fan-in). Template fixes the packet layout.</div>`; }
async function saveComms(){ const r=await api.post('/api/save',{kind:'comms',name:$('#c_name').value,data:{name:$('#c_name').value,channels:CHANNELS}});
  $('#c_stat').textContent=r.ok?('saved → '+r.path):('FAILED: '+r.msg); }

// ===========================================================================
// SCENARIO (compose)
// ===========================================================================
async function renderScenario(){
 const veh=await options('vehicles'),tire=await options('tires'),maps=await options('maps'),sens=await options('sensors'),comms=await options('comms');
 $('#form').innerHTML=`<h3>Scenario builder</h3>
  ${txt('name','x_name','my_experiment')}
  <div class="grp">Plant</div>
  ${sel('vehicle','x_veh',veh,veh[0]||'')}${sel('tire','x_tire',tire,tire[0]||'')}${sel('level','x_level',['K','L1','L2','L3'],'L3')}
  <div class="grp">Environment</div>
  ${sel('map','x_map',['(none)'].concat(maps),'(none)')}${sel('sensors','x_sens',['(none)'].concat(sens),'(none)')}
  <div class="grp">Run</div>
  ${sel('mode','x_mode',['api','rt_comms'],'api')}${sel('comms','x_comms',['(none)'].concat(comms),'(none)')}
  <div class="grp">Maneuver</div>
  ${sel('type','x_mtype',['path','constant_speed','step_steer','accel','brake'],'path')}
  ${num('target speed [m/s]','x_v',20)}${num('laps / hold [s]','x_p',5)}${num('steer [rad]','x_steer',0.03)}
  ${num('duration [s]','x_dur',30)}
  <div class="row"><button onclick="saveScenario()">Save scenario</button></div>
  <div class="stat" id="x_stat"></div>`;
 $('#side').innerHTML=`<h3>Composed experiment</h3><div class="stat" id="x_prev">vehicle + tire + level + map + maneuver + sensors → one reproducible configs/experiments/*.yaml that vdsim_lab runs.</div>`;
}
function scenData(){ const d={name:$('#x_name').value,vehicle:val('x_veh'),tire:val('x_tire'),level:val('x_level'),
   maneuver:{type:val('x_mtype'),v:val('x_v'),param:val('x_p'),steer:val('x_steer')},duration:val('x_dur')};
  if(val('x_map')!=='(none)') d.map=val('x_map'); if(val('x_sens')!=='(none)') d.sensors=val('x_sens');
  const run={mode:val('x_mode')}; if(val('x_comms')!=='(none)') run.comms=val('x_comms'); d.run=run; return d; }
async function saveScenario(){ const r=await api.post('/api/save',{kind:'experiments',name:$('#x_name').value,data:scenData()});
  $('#x_stat').textContent=r.ok?('saved → '+r.path):('FAILED: '+r.msg); }

tabbar(); render();
</script></body></html>
