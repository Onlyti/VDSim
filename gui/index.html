<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDSim Web GUI</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --ink:#e6edf3; --acc:#01A0E9; --dim:#8b949e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
              font-family:Calibri,Segoe UI,system-ui,sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  .panel { position:fixed; background:rgba(23,27,34,.92); border:1px solid #2a313b;
           border-radius:10px; padding:12px 14px; backdrop-filter:blur(4px); }
  #cfg { top:12px; left:12px; width:260px; }
  #hud { top:12px; right:12px; width:210px; font-variant-numeric:tabular-nums; }
  h1 { font:600 15px Tahoma; margin:0 0 8px; color:#fff; }
  h2 { font:600 11px Tahoma; margin:10px 0 4px; color:var(--dim); letter-spacing:.5px;
       text-transform:uppercase; }
  label { display:block; font-size:12px; margin:6px 0 2px; color:var(--dim); }
  select,input[type=range]{ width:100%; }
  select { background:#0e1116; color:var(--ink); border:1px solid #2a313b; border-radius:6px;
           padding:4px; }
  .row { display:flex; gap:6px; margin-top:8px; }
  button { flex:1; background:#222a35; color:var(--ink); border:1px solid #2a313b;
           border-radius:6px; padding:7px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#001018; border-color:var(--acc); }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
  .kv b { color:#fff; font-weight:600; }
  .sub { font-size:11px; color:var(--dim); }
  #conn { font-size:11px; }
  .toolbar { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:20; padding:6px; }
  .toolbar button { width:auto; padding:7px 12px; }
  .win { position:fixed; top:84px; left:300px; width:330px; max-height:74vh; overflow:auto;
         background:rgba(23,27,34,.97); border:1px solid #2a313b; border-radius:10px; display:none;
         z-index:30; box-shadow:0 10px 34px rgba(0,0,0,.55); }
  .win.open { display:block; }
  .win-h { display:flex; justify-content:space-between; align-items:center; padding:8px 12px;
           border-bottom:1px solid #2a313b; cursor:move; background:#1b2128; border-radius:10px 10px 0 0; }
  .win-h b { font:600 13px Tahoma; color:#fff; }
  .win-h .x { cursor:pointer; color:var(--dim); padding:0 6px; }
  .win-b { padding:10px 12px; }
  .grp { font:600 10px Tahoma; color:var(--acc); text-transform:uppercase; letter-spacing:.5px; margin:11px 0 4px; }
  .fld { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:3px 0; }
  .fld label { margin:0; font-size:11px; flex:1; color:var(--ink); }
  .fld input { width:72px; background:#0e1116; color:var(--ink); border:1px solid #2a313b; border-radius:4px; padding:3px; font-size:12px; }
  .fld .arr input { width:44px; }
  .apply { width:100%; margin-top:12px; background:var(--acc)!important; color:#001018!important; border-color:var(--acc)!important; }
  .speed.on { background:var(--acc); color:#001018; border-color:var(--acc); }
  .fld.na { opacity:.35; }
  .badge { font-size:9px; color:var(--dim); border:1px solid #2a313b; border-radius:3px; padding:0 3px; margin-left:5px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>

<div id="cfg" class="panel">
  <h1>VDSim</h1>
  <div id="conn" class="sub">connecting…</div>
  <h2>Vehicle</h2>
  <select id="vehicle"></select>
  <h2>Dynamics level</h2>
  <select id="level"></select>
  <h2>Target speed <span id="vtv" class="sub"></span></h2>
  <input id="vt" type="range" min="0" max="30" step="0.5">
  <div class="row">
    <button id="drv" class="on">Autopilot</button>
    <button id="man">Manual</button>
  </div>
  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
  </div>
  <h2>Camera</h2>
  <div class="row">
    <button id="cam_orbit" class="on">Orbit</button>
    <button id="cam_chase">Chase</button>
    <button id="cam_top">Top</button>
  </div>
  <div class="sub" style="margin-top:8px">Manual: ↑/↓ throttle/brake, ←/→ steer</div>
</div>

<div id="hud" class="panel">
  <h2>State</h2>
  <div class="kv"><span>t</span><b id="h_t">—</b></div>
  <div class="kv"><span>vx</span><b id="h_vx">—</b></div>
  <div class="kv"><span>vy</span><b id="h_vy">—</b></div>
  <div class="kv"><span>yaw rate</span><b id="h_r">—</b></div>
  <div class="kv"><span>ax</span><b id="h_ax">—</b></div>
  <div class="kv"><span>ay</span><b id="h_ay">—</b></div>
  <div class="kv"><span>roll</span><b id="h_roll">—</b></div>
  <div class="kv"><span>pitch</span><b id="h_pitch">—</b></div>
  <div class="kv"><span>steer</span><b id="h_steer">—</b></div>
  <h2>Fz [N] FL FR RL RR</h2>
  <div class="sub" id="h_fz">—</div>
</div>

<div class="toolbar panel">
  <button id="tb_veh">Vehicle</button>
  <button id="tb_tire">Tire</button>
  <button id="tb_sim">Simulation</button>
</div>

<div id="win_veh" class="win"><div class="win-h"><b>Vehicle parameters</b><span class="x">✕</span></div><div class="win-b" id="veh_body"></div></div>
<div id="win_tire" class="win"><div class="win-h"><b>Tire parameters</b><span class="x">✕</span></div><div class="win-b" id="tire_body"></div></div>
<div id="win_sim" class="win"><div class="win-h"><b>Simulation</b><span class="x">✕</span></div><div class="win-b" id="sim_body"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- scene ----
const view = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(15, 14, 22);
// WebGL2 renderer for the demo; WebGPURenderer is a later (quality) swap.
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
// Orthographic camera for the top-down mode.
const orthoSize = 70;
let _a0 = innerWidth/innerHeight;
const orthoCam = new THREE.OrthographicCamera(
  -orthoSize*_a0/2, orthoSize*_a0/2, orthoSize/2, -orthoSize/2, 0.1, 2000);
orthoCam.position.set(0,120,0); orthoCam.up.set(0,0,-1); orthoCam.lookAt(0,0,0);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x202830, 1.1));
const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(20,40,15); scene.add(dir);
const grid = new THREE.GridHelper(120, 60, 0x2a313b, 0x1b2027); scene.add(grid);

// figure-eight reference path (R=20, matches server driver) in ground plane.
function fig8(R=20, n=160){
  const pts=[];
  for(let i=0;i<=n;i++){ const t=2*Math.PI*i/n; pts.push(new THREE.Vector3(R-R*Math.cos(t),0.02,-(R*Math.sin(t)))); }
  for(let i=0;i<=n;i++){ const t=2*Math.PI*i/n; pts.push(new THREE.Vector3(-R+R*Math.cos(t),0.02,-(R*Math.sin(t)))); }
  return pts;
}
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(fig8()),
          new THREE.LineBasicMaterial({color:0x2f6d8f})));

// ---- car ----
// car (group): heading (yaw) + position. sprung (child): roll/pitch (leans the
// body+cabin only). wheels stay on the car group so they remain grounded.
const car = new THREE.Group();
const sprung = new THREE.Group(); car.add(sprung);
const body = new THREE.Mesh(new THREE.BoxGeometry(4.2,1.1,1.8),
              new THREE.MeshStandardMaterial({color:0x01A0E9, metalness:.3, roughness:.5}));
body.position.y = 0.75; sprung.add(body);
const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.7,1.5),
              new THREE.MeshStandardMaterial({color:0x9fd8f5}));
cabin.position.set(-0.2,1.45,0); sprung.add(cabin);
const wheelGeo = new THREE.CylinderGeometry(0.34,0.34,0.25,16);
const wheelMat = new THREE.MeshStandardMaterial({color:0x14181f});
const wxz = [[1.4,0.75],[1.4,-0.75],[-1.4,0.75],[-1.4,-0.75]]; // FL FR RL RR (x fwd, z=-left)
for(const [wx,wz] of wxz){ const w=new THREE.Mesh(wheelGeo,wheelMat);
  w.rotation.x=Math.PI/2; w.position.set(wx,0.34,wz); car.add(w); }
scene.add(car);

// trail — drawn ON TOP of the grid (depthTest off + high renderOrder) and raised,
// so it stays visible from any view angle. setFromPoints rebuilds a connected
// line each update (reliable for a growing path).
const MAXT=1500;
let trailPts=[];
const trailGeo=new THREE.BufferGeometry();
const trailMat=new THREE.LineBasicMaterial({color:0xffb020, depthTest:false,
                                            transparent:true, opacity:0.95});
const trail=new THREE.Line(trailGeo, trailMat);
trail.renderOrder=2; trail.frustumCulled=false; trail.visible=false; scene.add(trail);
function pushTrail(x,z){
  trailPts.push(new THREE.Vector3(x, 0.12, z));
  if(trailPts.length>MAXT) trailPts.shift();
  if(trailPts.length>=2){ trailGeo.setFromPoints(trailPts); trail.visible=true; }
}

// VDSim ENU (x east, y north, z up) -> three (x, z_up, -y)
function toThree(x,y,z){ return new THREE.Vector3(x, z, -y); }

let camMode='orbit';   // 'orbit' (track + free orbit) | 'chase' (third-person) | 'top' (ortho)
// Interpolation target (set from the SSE stream); the render loop eases the car
// toward it every frame so motion is smooth regardless of the stream rate.
const tgt={pos:new THREE.Vector3(), yaw:0, roll:0, pitch:0, vx:0, vy:0, r:0, has:false};
const lerpAngle=(a,b,t)=>{ let d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; return a+d*t; };
const clock=new THREE.Clock();
// Follow = translate camera + orbit target by the car's motion each frame, so
// the car stays framed while OrbitControls still lets you change view angle/zoom.
const prevCarPos=new THREE.Vector3(); let prevInit=false;
function frame(){ requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(), 0.1);
  if(tgt.has){
    // Dead-reckon at the reported velocity (smooth, true speed), then gently
    // correct toward the authoritative target — avoids ease-in/out stutter.
    const yaw=car.rotation.y;
    const vE=tgt.vx*Math.cos(yaw)-tgt.vy*Math.sin(yaw);   // body -> ENU
    const vN=tgt.vx*Math.sin(yaw)+tgt.vy*Math.cos(yaw);
    car.position.x +=  vE*dt;            // ENU x -> three x
    car.position.z += -vN*dt;            // ENU y -> three -z
    car.position.lerp(tgt.pos, 0.10);    // drift correction toward latest state
    car.rotation.set(0, lerpAngle(yaw + tgt.r*dt, tgt.yaw, 0.15), 0);
    sprung.rotation.x += (tgt.roll     - sprung.rotation.x)*0.3;
    sprung.rotation.z += ((-tgt.pitch) - sprung.rotation.z)*0.3;
  }
  const cp=car.position;
  if(!prevInit){ prevCarPos.copy(cp); prevInit=true; }
  let activeCam=camera;
  if(camMode==='orbit'){
    // track car translation; OrbitControls still free for angle/zoom
    const d=cp.clone().sub(prevCarPos);
    camera.position.add(d); controls.target.add(d);
    controls.enabled=true; controls.update();
  } else if(camMode==='chase'){
    // third-person chase: locked behind the car heading
    controls.enabled=false;
    const yaw=car.rotation.y, fx=Math.cos(yaw), fz=-Math.sin(yaw);  // forward (three)
    camera.position.lerp(new THREE.Vector3(cp.x-fx*11, cp.y+5, cp.z-fz*11), 0.12);
    camera.lookAt(cp.x, cp.y+1.2, cp.z);
  } else { // top-down orthographic
    controls.enabled=false;
    orthoCam.position.set(cp.x, 120, cp.z);
    orthoCam.lookAt(cp.x, 0, cp.z);
    activeCam=orthoCam;
  }
  prevCarPos.copy(cp);
  renderer.render(scene, activeCam);
}
frame();
addEventListener('resize',()=>{ const a=innerWidth/innerHeight;
  camera.aspect=a; camera.updateProjectionMatrix();
  orthoCam.left=-orthoSize*a/2; orthoCam.right=orthoSize*a/2;
  orthoCam.top=orthoSize/2; orthoCam.bottom=-orthoSize/2; orthoCam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

// ---- HUD + state stream ----
const $=id=>document.getElementById(id);
const f=(v,p=2)=> (v==null?'—':(+v).toFixed(p));
function applyState(s){
  if(s.x==null) return;
  // Store as interpolation target; the render loop eases toward it (smooth).
  tgt.pos.copy(toThree(s.x,s.y,0)); tgt.yaw=s.yaw; tgt.roll=s.roll||0; tgt.pitch=s.pitch||0;
  tgt.vx=s.vx||0; tgt.vy=s.vy||0; tgt.r=s.r||0;   // for dead-reckoning between updates
  if(!tgt.has){ car.position.copy(tgt.pos); car.rotation.set(0,tgt.yaw,0); tgt.has=true; }
  pushTrail(tgt.pos.x, tgt.pos.z);   // trail at stream rate, from target position
  $('h_t').textContent=f(s.t); $('h_vx').textContent=f(s.vx)+' m/s';
  $('h_vy').textContent=f(s.vy); $('h_r').textContent=f(s.r,3)+' rad/s';
  $('h_ax').textContent=f(s.ax); $('h_ay').textContent=f(s.ay);
  $('h_roll').textContent=f(s.roll,3); $('h_pitch').textContent=f(s.pitch,3);
  $('h_steer').textContent=f(s.steer,3)+' rad';
  if(s.Fz) $('h_fz').textContent=s.Fz.map(v=>Math.round(v)).join('  ');
}
const es=new EventSource('/api/stream');
es.onopen=()=> $('conn').textContent='● live';
es.onerror=()=> $('conn').textContent='● disconnected';
es.onmessage=e=>{ try{ applyState(JSON.parse(e.data)); }catch(_){} };

// ---- config / control ----
async function post(url,obj){ await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}); }
const LEVEL_LABEL={K:'L0 Kinematic', L1:'L1 Bicycle', L2:'L2 7-DOF', L3:'L3 14-DOF'};
async function loadConfig(){
  const r=await(await fetch('/api/config')).json();
  const v=$('vehicle'); v.innerHTML=r.vehicles.map(x=>`<option ${x===r.config.vehicle?'selected':''}>${x}</option>`).join('');
  const l=$('level'); l.innerHTML=r.levels.map(x=>`<option value="${x}" ${x===r.config.level?'selected':''}>${LEVEL_LABEL[x]||x}</option>`).join('');
  $('vt').value=r.config.v_target; $('vtv').textContent=r.config.v_target+' m/s';
}
loadConfig();
$('vehicle').onchange=e=>post('/api/config',{vehicle:e.target.value});
$('level').onchange=async e=>{ await post('/api/config',{level:e.target.value});
  // refresh open param panels so level-applicability updates
  if($('win_veh').classList.contains('open')) buildForm('/api/vehicle','veh_body');
  if($('win_tire').classList.contains('open')) buildForm('/api/tire','tire_body'); };
$('vt').oninput=e=>{ $('vtv').textContent=e.target.value+' m/s'; };
$('vt').onchange=e=>post('/api/config',{v_target:+e.target.value});
$('start').onclick=()=>post('/api/control',{action:'start'});
$('stop').onclick =()=>post('/api/control',{action:'stop'});
$('reset').onclick=()=>{ trailPts=[]; trail.visible=false; tgt.has=false; post('/api/control',{action:'reset'}); };
function setCam(m){ camMode=m;
  ['orbit','chase','top'].forEach(id=>$('cam_'+id).classList.toggle('on', id===m));
  if(m==='orbit') controls.target.copy(car.position);   // re-frame; drag still orbits
}
$('cam_orbit').onclick=()=>setCam('orbit');
$('cam_chase').onclick=()=>setCam('chase');
$('cam_top').onclick=()=>setCam('top');
function setMode(driver){ post('/api/config',{driver}); $('drv').classList.toggle('on',driver); $('man').classList.toggle('on',!driver); }
$('drv').onclick=()=>setMode(true);
$('man').onclick=()=>setMode(false);

// manual keyboard control
const man={throttle:0,brake:0,steer:0}; const keys={};
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
setInterval(()=>{
  if($('man').classList.contains('on')){
    man.throttle=keys['ArrowUp']?0.7:0; man.brake=keys['ArrowDown']?0.6:0;
    man.steer=(keys['ArrowLeft']?0.25:0)+(keys['ArrowRight']?-0.25:0);
    post('/api/manual',man);
  }
},80);

// ---- floating windows (draggable) ----
function makeDraggable(win){
  const h=win.querySelector('.win-h'); let sx,sy,ox,oy,dragging=false;
  h.addEventListener('mousedown',e=>{ if(e.target.classList.contains('x'))return;
    dragging=true; sx=e.clientX; sy=e.clientY; const r=win.getBoundingClientRect(); ox=r.left; oy=r.top; e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(!dragging)return;
    win.style.left=(ox+e.clientX-sx)+'px'; win.style.top=(oy+e.clientY-sy)+'px'; });
  addEventListener('mouseup',()=>dragging=false);
  win.querySelector('.x').onclick=()=>win.classList.remove('open');
}
['win_veh','win_tire','win_sim'].forEach(id=>makeDraggable($(id)));

// ---- schema-driven param form (vehicle/tire) ----
async function buildForm(apiPath, bodyId){
  const cfg=(await(await fetch('/api/config')).json()).config;
  const lvl=cfg.level;
  const r=await(await fetch(apiPath)).json();
  const groups={}; r.fields.forEach(f=>{ (groups[f.group]=groups[f.group]||[]).push(f); });
  const el=$(bodyId); el.innerHTML='';
  for(const g in groups){
    const gh=document.createElement('div'); gh.className='grp'; gh.textContent=g; el.appendChild(gh);
    groups[g].forEach(f=>{
      const applies = f.levels.includes(lvl);
      const row=document.createElement('div'); row.className='fld'+(applies?'':' na');
      const lab=document.createElement('label'); lab.textContent=f.label;
      if(!applies){ const b=document.createElement('span'); b.className='badge'; b.textContent=f.levels.join('/'); lab.appendChild(b); }
      row.appendChild(lab);
      if(f.array){ const wrap=document.createElement('span'); wrap.className='arr';
        f.value.forEach((v,i)=>{ const inp=document.createElement('input'); inp.type='number'; inp.step='any';
          inp.value=v; inp.dataset.name=f.name; inp.dataset.idx=i; inp.disabled=!applies; wrap.appendChild(inp); });
        row.appendChild(wrap);
      } else { const inp=document.createElement('input'); inp.type='number'; inp.step='any';
        inp.value=f.value; inp.dataset.name=f.name; inp.disabled=!applies; row.appendChild(inp); }
      el.appendChild(row);
    });
  }
  const btn=document.createElement('button'); btn.className='apply'; btn.textContent='Apply (rebuild sim)';
  btn.onclick=async()=>{ const out={}, arrs={};
    el.querySelectorAll('input[data-name]').forEach(inp=>{ const nm=inp.dataset.name;
      if(inp.dataset.idx!==undefined){ (arrs[nm]=arrs[nm]||[])[+inp.dataset.idx]=+inp.value; }
      else out[nm]=+inp.value; });
    Object.assign(out, arrs); await post(apiPath, out);
  };
  el.appendChild(btn);
}

// ---- simulation panel ----
async function buildSim(){
  const c=(await(await fetch('/api/config')).json()).config;
  const el=$('sim_body');
  el.innerHTML=`<div class="grp">Time step</div>
    <div class="fld"><label>dt [s]</label><input id="sim_dt" type="number" step="any" value="${c.dt}"></div>
    <div class="grp">Playback speed (real-time ×)</div><div class="row" id="speedrow"></div>
    <div class="grp">Run</div>
    <div class="row"><button id="sim_start">Start</button><button id="sim_stop">Stop</button><button id="sim_reset">Reset</button></div>`;
  const sr=$('speedrow');
  [0.1,0.5,1,2,3].forEach(s=>{ const b=document.createElement('button');
    b.className='speed'+(Math.abs(s-c.time_scale)<1e-6?' on':''); b.textContent=s+'×';
    b.onclick=async()=>{ await post('/api/sim',{time_scale:s}); [...sr.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    sr.appendChild(b); });
  $('sim_dt').onchange=e=>post('/api/sim',{dt:+e.target.value});
  $('sim_start').onclick=()=>post('/api/control',{action:'start'});
  $('sim_stop').onclick =()=>post('/api/control',{action:'stop'});
  $('sim_reset').onclick=()=>{ trailPts=[]; trail.visible=false; tgt.has=false; post('/api/control',{action:'reset'}); };
}

function openWin(id, build){ const w=$(id); w.classList.toggle('open'); if(w.classList.contains('open')) build(); }
$('tb_veh').onclick =()=>openWin('win_veh', ()=>buildForm('/api/vehicle','veh_body'));
$('tb_tire').onclick=()=>openWin('win_tire',()=>buildForm('/api/tire','tire_body'));
$('tb_sim').onclick =()=>openWin('win_sim', buildSim);
</script>
</body>
</html>
