name: Deploy docs (release version)

on:
  push:
    tags:
      - 'v*.*'        # e.g. v0.95, v1.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.95-PoC)'
        required: true
      alias:
        description: 'Optional alias (e.g. latest, stable)'
        required: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material + mike
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pymdown-extensions mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pick version from tag or input
        id: vsn
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "alias=stable" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "alias=${{ inputs.alias }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy with mike
        run: |
          if [ -n "${{ steps.vsn.outputs.alias }}" ]; then
            mike deploy --push --update-aliases \
              "${{ steps.vsn.outputs.version }}" "${{ steps.vsn.outputs.alias }}"
          else
            mike deploy --push "${{ steps.vsn.outputs.version }}"
          fi
