name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Single pinned CMake for every job in this workflow, matching the version
  # recorded on the `toolchain:` line of docs/VALIDATION.md. Never `latest`:
  # a toolchain bump is a re-measurement trigger, so it has to be an explicit
  # edit that lands in the same commit as the refreshed numbers.
  VDSIM_CMAKE_VERSION: 3.31.10

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-11,   cc: gcc-11,   cxx: g++-11 }
          - { name: clang-14, cc: clang-14, cxx: clang++-14 }
        build_type: [Debug, Release]

    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            python3-dev \
            ${{ matrix.compiler.cc }} \
            ${{ matrix.compiler.cxx }}

      # The ctest suite registers ~17 Python tests unconditionally (cosim/
      # CMakeLists.txt); they import the `vdsim` extension module, so the
      # bindings must be built or every one of them fails with
      # ModuleNotFoundError. pybind11 is pinned: it decides how the module is
      # compiled, so an unpinned bump is a silent toolchain change.
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "pybind11==2.13.6" numpy pyyaml

      - name: Report toolchain
        run: |
          python3 --version
          python3 -c "import pybind11, numpy, yaml; print('pybind11', pybind11.__version__); print('numpy', numpy.__version__); print('pyyaml', yaml.__version__)"
      - name: Pin CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.VDSIM_CMAKE_VERSION }}

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ matrix.compiler.name }}-${{ hashFiles('third_party/CMakeLists.txt') }}

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVDSIM_BUILD_PYTHON=ON \
            -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build -j

      # The plant speed budget is a Release contract. Debug builds carry no
      # optimisation, so they are given the budget that matches what they are,
      # not an exemption: the assert still runs and still fails on a real
      # regression.
      - name: Test
        working-directory: build
        env:
          VDSIM_PERF_BUDGET_S: ${{ matrix.build_type == 'Debug' && '10.0' || '1.0' }}
        run: ctest --output-on-failure

  # Canonical configuration (the `validation` CMake preset). This is the only
  # job whose ctest numbers docs/VALIDATION.md is allowed to record, and the
  # gate below fails if the document no longer matches what was measured.
  # See VDSimMarketing 07_p0_demo.md 6.4 / 6.5 / 6.6.
  validation:
    runs-on: ubuntu-22.04
    name: validation preset / currency gate

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the currency gate can test whether the commit
          # recorded in docs/VALIDATION.md is an ancestor of what was built.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Pin CMake
        # CMakePresets.json is version 3, which needs CMake >= 3.21, so the
        # runner image default is deliberately not relied upon.
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.VDSIM_CMAKE_VERSION }}

      - name: Record toolchain
        run: cmake --version | tee cmake-version.txt

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build-validation/_deps
          key: ${{ runner.os }}-deps-validation-${{ hashFiles('third_party/CMakeLists.txt') }}

      - name: Configure (validation preset)
        run: cmake --preset validation

      - name: Build (validation preset)
        run: cmake --build --preset validation

      - name: List registered tests
        run: ctest --preset validation -N | tee ctest-list.txt

      - name: Run tests
        id: run
        continue-on-error: true
        run: ctest --preset validation | tee ctest-run.txt

      - name: VALIDATION.md currency gate
        run: |
          python3 scripts/check_validation_currency.py \
            --doc docs/VALIDATION.md \
            --ctest-list ctest-list.txt \
            --ctest-run ctest-run.txt \
            --cmake-version-file cmake-version.txt \
            --commit "${{ github.sha }}" \
            --repo .

      - name: Fail if the suite did not pass
        if: steps.run.outcome != 'success'
        run: |
          echo "ctest reported failures in the canonical configuration"
          exit 1
